name: Build CleanGram APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_signed: ${{ steps.signing.outputs.available }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
      - name: Test distraction filters
        run: node --test scripts/test-distraction-filter.cjs scripts/test-shell-navigation.cjs
      - name: Test
        run: gradle testDebugUnitTest lintDebug --stacktrace
      - name: Upload native shell previews and Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanGram-Android-Checks
          path: |
            app/build/outputs/shell-previews/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Check release signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::notice::Release signing is not configured. Building a preview APK; see README.md for update signing setup."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cleangram.jks"
      - name: Build signed update APK
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/cleangram.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.1.${{ github.run_number }}
        run: gradle assembleRelease --stacktrace
      - name: Build preview APK
        if: steps.signing.outputs.available != 'true'
        run: gradle assembleDebug --stacktrace
      - name: Upload signed update APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CleanGram-APK
          path: app/build/outputs/apk/release/*-release.apk
          if-no-files-found: error
      - name: Upload preview APK
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CleanGram-Preview-APK
          path: app/build/outputs/apk/debug/*-debug.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cleangram.jks"


  publish-release:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.release_signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cleangram-release
      cancel-in-progress: false
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: CleanGram-APK
          path: release
      - name: Publish update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CODE: ${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_CODE"
          # Reruns must not replace an already published update.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          cp release/app-release.apk "release/cleangram-$RELEASE_CODE.apk"
          latest_tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          latest_flag=()
          if [[ "$latest_tag" =~ ^v([0-9]+)$ ]] && (( BASH_REMATCH[1] > RELEASE_CODE )); then
            latest_flag=(--latest=false)
          fi
          gh release create "$tag" "release/cleangram-$RELEASE_CODE.apk" \
            --target "$RELEASE_COMMIT" --title "CleanGram 1.1.$RELEASE_CODE" \
            --generate-notes "${latest_flag[@]}"

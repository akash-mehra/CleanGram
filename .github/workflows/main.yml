name: Build CleanGram APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools"; the obsolete "tools" package was removed from
          # Google's SDK repository, so sdkmanager now fails trying to install it. AGP fetches
          # the platform and build-tools it needs by itself.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        env:
          # The in-app updater compares this against the release tag below.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanGram-APK
          path: "**/build/outputs/apk/debug/*.apk"

      # Published as a release because release assets download without authentication,
      # which is what lets the in-app updater fetch them with no token in the APK.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running a workflow reuses its run number, so clear any existing tag first.
          gh release delete "v${{ github.run_number }}" --yes --cleanup-tag || true
          gh release create "v${{ github.run_number }}" \
            --title "CleanGram v${{ github.run_number }}" \
            --notes "Automated build of ${{ github.sha }}" \
            app/build/outputs/apk/debug/*.apk
